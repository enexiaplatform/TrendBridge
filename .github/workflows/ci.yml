name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run quality gate
        run: npm run check
      - name: Verify research journey over HTTP
        run: |
          npm run dev -- --port 3101 > /tmp/trendbridge-dev.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl -fsS http://localhost:3101/ > /dev/null; then break; fi
            sleep 1
          done
          TB_HTTP_ORIGIN=http://localhost:3101 npx vitest run tests/http.test.ts tests/launch-http.test.ts --maxWorkers=1
